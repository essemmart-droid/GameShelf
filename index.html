<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameShelf</title>
  <style>
  body {
    background-color: #f3f4f6;
  }
    .summary-card {
  background-color: white;
  padding: 20px;
  border-radius: 12px;
}
    label {
  display: block;
  margin-top: 12px;
  margin-bottom: 4px;
}

input {
  display: block;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 8px;
}
    .add-game-button {
  background-color: #2563eb;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>

<body>
  <h1>🎮 GameShelf</h1>
  <p>My personal game tracker</p>


  
  <div class="summary-card">
    <h2>My Library</h2>
    <p>0 games</p>
    <p>0 hours played</p>
    <label for="game-title">Title</label>
<input type="text" id="game-title" placeholder="Enter game title">
    <label for="purchase-price">Purchase price</label>
<input type="number" id="purchase-price" placeholder="0.00" step="0.01">

<label for="hours-played">Hours played</label>
<input type="number" id="hours-played" placeholder="0" step="0.1">

<label for="completion-hours">Estimated hours to 100%</label>
<input type="number" id="completion-hours" placeholder="0" step="0.1">

<button class="add-game-button" onclick="addGame()">+ Add Game</button>
<div id="game-list"></div>
  </div>
</body>

  <script>
  function addGame() {
  const title = document.getElementById("game-title").value;
  const price = Number(document.getElementById("purchase-price").value);
  const hours = Number(document.getElementById("hours-played").value);
  const completionHours = Number(document.getElementById("completion-hours").value);

  const gameList = document.getElementById("game-list");

  let currentCost = "Not played yet";
  let potentialCost = "Unknown";

  if (hours > 0) {
    currentCost = "$" + (price / hours).toFixed(2) + "/hr";
  }

  if (completionHours > 0) {
    potentialCost = "$" + (price / completionHours).toFixed(2) + "/hr";
  }

  gameList.innerHTML = `
    <div>
      <h3>${title}</h3>
      <p>Purchase price: $${price.toFixed(2)}</p>
      <p>Hours played: ${hours}</p>
      <p>Estimated 100% time: ${completionHours} hours</p>
      <p>Current cost per hour: ${currentCost}</p>
      <p>Potential cost per hour: ${potentialCost}</p>
    </div>
  `;
}

  
  </script>
  
</html>
