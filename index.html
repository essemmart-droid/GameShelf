<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameShelf</title>
  <style>
  body {
    background-color: #f3f4f6;
  }
    .summary-card {
  background-color: white;
  padding: 20px;
  border-radius: 12px;
}
    .add-game-button {
  background-color: #2563eb;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
    <div id="game-list"></div>
</style>
</head>

<body>
  <h1>🎮 GameShelf</h1>
  <p>My personal game tracker</p>


  
  <div class="summary-card">
    <h2>My Library</h2>
    <p>0 games</p>
    <p>0 hours played</p>
    <label for="game-title">Title</label>
<input type="text" id="game-title" placeholder="Enter game title">
<button class="add-game-button" onclick="addGame()">+ Add Game</button>
  </div>
</body>

  <script>
  function addGame() {
  const title = document.getElementById("game-title").value;
  const gameList = document.getElementById("game-list");

  gameList.innerHTML = `<p>${title}</p>`;
}

  alert(title);
}
  </script>
  
</html>
