<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameShelf</title>
  <style>
  body {
    background-color: #f3f4f6;
  }
    .summary-card {
  background-color: white;
  padding: 20px;
  border-radius: 12px;
}
    label {
  display: block;
  margin-top: 12px;
  margin-bottom: 4px;
}

input {
  display: block;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 8px;
}

    .game-title {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  font-weight: bold;
  color: #2563eb;
  cursor: pointer;
}
    
    .add-game-button {
  background-color: #2563eb;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>

<body>
  <h1>🎮 GameShelf</h1>
  <p>My personal game tracker</p>


  
  <div class="summary-card">
    <h2>My Library</h2>
    <p id="game-count">0 games</p>
<p id="total-hours">0 hours played</p>
    <p id="current-cost">Current cost per hour: —</p>
<p id="potential-cost">Potential cost per hour: —</p>
    
    <label for="game-title">Title</label>
<input type="text" id="game-title" placeholder="Enter game title">
    <label for="purchase-price">Purchase price</label>
<input type="number" id="purchase-price" placeholder="0.00" step="0.01">

<label for="hours-played">Hours played</label>
<input type="number" id="hours-played" placeholder="0" step="0.1">

<label for="completion-hours">Estimated hours to 100%</label>
<input type="number" id="completion-hours" placeholder="0" step="0.1">

<button class="add-game-button" onclick="addGame()">+ Add Game</button>
<div id="game-list"></div>
  </div>
</body>


<script>
  let games = JSON.parse(localStorage.getItem("games")) || [];
  games.forEach(function(game) {
  if (!game.id) {
    game.id = crypto.randomUUID();
  }
});

localStorage.setItem("games", JSON.stringify(games));


  function updateSummary() {
  const gameCount = games.length;

  let totalHours = 0;
    let totalPrice = 0;
let totalPotentialHours = 0;

games.forEach(function(game) {
  totalHours = totalHours + game.hours;
  totalPrice = totalPrice + game.price;
  totalPotentialHours = totalPotentialHours + game.completionHours;
});

let currentCost = "—";
let potentialCost = "—";

if (totalHours > 0) {
  currentCost = "$" + (totalPrice / totalHours).toFixed(2) + "/hr";
}

if (totalPotentialHours > 0) {
  potentialCost = "$" + (totalPrice / totalPotentialHours).toFixed(2) + "/hr";
}
    
  document.getElementById("game-count").textContent = gameCount + " games";
  document.getElementById("total-hours").textContent = totalHours + " hours played";
    document.getElementById("current-cost").textContent =
  "Current cost per hour: " + currentCost;

document.getElementById("potential-cost").textContent =
  "Potential cost per hour: " + potentialCost;
}
  
  function displayGame(game) {
    const gameList = document.getElementById("game-list");

    let currentCost = "Not played yet";
    let potentialCost = "Unknown";

    if (game.hours > 0) {
      currentCost = "$" + (game.price / game.hours).toFixed(2) + "/hr";
    }

    if (game.completionHours > 0) {
      potentialCost = "$" + (game.price / game.completionHours).toFixed(2) + "/hr";
    }

    gameList.innerHTML += `
      <div>
        <h3>
  <button class="game-title" onclick="openGame('${game.id}')">${game.title}</button>
</h3>

        <p>Purchase price: $${game.price.toFixed(2)}</p>
        <p>Hours played: ${game.hours}</p>
        <p>Estimated 100% time: ${game.completionHours} hours</p>
        <p>Current cost per hour: ${currentCost}</p>
        <p>Potential cost per hour: ${potentialCost}</p>
      </div>
    `;
  }

  function openGame(gameId) {
  const game = games.find(function(game) {
    return game.id === gameId;
  });

  alert("You opened " + game.title);
}
  function addGame() {
    const title = document.getElementById("game-title").value;
    const price = Number(document.getElementById("purchase-price").value);
    const hours = Number(document.getElementById("hours-played").value);
    const completionHours = Number(document.getElementById("completion-hours").value);

   const game = {
  id: crypto.randomUUID(),
  title: title,
  price: price,
  hours: hours,
  completionHours: completionHours
};

    games.push(game);

    localStorage.setItem("games", JSON.stringify(games));

    displayGame(game);
    updateSummary();
  }

  games.forEach(displayGame);
  updateSummary();
</script>

  
  
</html>
