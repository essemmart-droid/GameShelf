<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameShelf</title>
  <style>
  body {
    background-color: #f3f4f6;
  }
    .summary-card {
  background-color: white;
  padding: 20px;
  border-radius: 12px;
}
    label {
  display: block;
  margin-top: 12px;
  margin-bottom: 4px;
}

input {
  display: block;
  padding: 10px;
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 8px;
}

select {
  display: block;
  width: 100%;
  padding: 10px;
  margin-top: 4px;
  margin-bottom: 16px;
  box-sizing: border-box;
  font-size: 16px;
}
    
    .game-title {
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  font-weight: bold;
  color: #2563eb;
  cursor: pointer;
}
    
    .add-game-button {
  background-color: #2563eb;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}
</style>
</head>

<body>
  <h1>🎮 GameShelf</h1>
  <p>My personal game tracker</p>


  
<div class="summary-card" id="library-view">
    <h2>My Library</h2>
    <p id="game-count">0 games</p>
<p id="total-hours">0 hours played</p>
    <p id="current-cost">Current cost per hour: —</p>
<p id="potential-cost">Potential cost per hour: —</p>
    
   

<button class="add-game-button" onclick="showAddGame()">+ Add Game</button>

<label for="filter-status">Show games</label>

<select id="filter-status" onchange="refreshGameList()">
  <option value="all">All Games</option>
  <option value="not-started">Not Started</option>
  <option value="playing">Playing</option>
  <option value="paused">Paused</option>
  <option value="dropped">Dropped</option>
  <option value="finished">Finished</option>
  <option value="completed">100%</option>
  <option value="not-completed">Not 100%</option>
</select>
  
  <label for="sort-games">Sort games by</label>

<select id="sort-games" onchange="refreshGameList()">
  <option value="title-asc">Title: A–Z</option>
  <option value="title-desc">Title: Z–A</option>
  
  <option value="status-asc">Status: A–Z</option>
<option value="status-desc">Status: Z–A</option>

  <option value="price-asc">Purchase price: Low–High</option>
  <option value="price-desc">Purchase price: High–Low</option>

  <option value="hours-desc">Hours played: High–Low</option>
  <option value="hours-asc">Hours played: Low–High</option>

  <option value="completion-desc">100% estimate: High–Low</option>
  <option value="completion-asc">100% estimate: Low–High</option>

  <option value="current-cost-desc">Current $/hour: High–Low</option>
  <option value="current-cost-asc">Current $/hour: Low–High</option>

  <option value="potential-cost-desc">Potential $/hour: High–Low</option>
  <option value="potential-cost-asc">Potential $/hour: Low–High</option>
</select>
  
<div id="game-list"></div>
  </div>

<div class="summary-card" id="add-view" style="display: none;">
  <h2>Add a Game</h2>

  <label for="game-title">Title</label>
  <input type="text" id="game-title" placeholder="Enter game title">

  <label for="purchase-price">Purchase price</label>
  <input type="number" id="purchase-price" placeholder="0.00" step="0.01">

  <label for="hours-played">Hours played</label>
  <input type="number" id="hours-played" placeholder="0" step="0.1">

  <label for="completion-hours">Estimated hours to 100%</label>
  <input type="number" id="completion-hours" placeholder="0" step="0.1">

<label for="game-status">Status</label>
<select id="game-status">
  <option value="not-started">Not Started</option>
  <option value="playing">Playing</option>
  <option value="paused">Paused</option>
  <option value="dropped">Dropped</option>
  <option value="finished">Finished</option>
  <option value="completed">100%</option>
</select>

  
  <button class="add-game-button" onclick="addGame()">Save Game</button>
  <button onclick="cancelAddGame()">Cancel</button>
</div>
  
  <div class="summary-card" id="details-view" style="display: none;">
  <button onclick="showLibrary()">← Back to Library</button>

  <h2 id="details-title"></h2>

  <p id="details-price"></p>
  <p id="details-hours"></p>
  <p id="details-completion"></p>
    <p id="details-status"></p>
  <p id="details-current-cost"></p>
  <p id="details-potential-cost"></p>

<h3>Playthroughs</h3>
<div id="playthrough-list"></div>
    
    <button class="add-game-button" onclick="editGame()">Edit Game</button>
    
</div>

  <div class="summary-card" id="edit-view" style="display: none;">
  <h2>Edit Game</h2>

  <label for="edit-title">Title</label>
  <input type="text" id="edit-title">

  <label for="edit-price">Purchase price</label>
  <input type="number" id="edit-price" step="0.01">

  <label for="edit-hours">Hours played</label>
  <input type="number" id="edit-hours" step="0.1">

  <label for="edit-completion-hours">Estimated hours to 100%</label>
  <input type="number" id="edit-completion-hours" step="0.1">

<label for="edit-status">Status</label>
<select id="edit-status">
  <option value="not-started">Not Started</option>
  <option value="playing">Playing</option>
  <option value="paused">Paused</option>
  <option value="dropped">Dropped</option>
  <option value="finished">Finished</option>
  <option value="completed">100%</option>
</select>
    
  <button class="add-game-button" onclick="saveGame()">Save Changes</button>
  <button onclick="cancelEdit()">Cancel</button>
</div>
  
</body>


<script>
  let games = JSON.parse(localStorage.getItem("games")) || [];
  let selectedGameId = null;
  games.forEach(function(game) {
  if (!game.id) {
    game.id = crypto.randomUUID();
  }

  if (!game.status) {
    game.status = "playing";
  }

  if (!game.playthroughs) {
    game.playthroughs = [
      {
        id: crypto.randomUUID(),
        number: 1,
        status: game.status,
        startedDate: null,
        endedDate: null,
        sessions: []
      }
    ];
  }
});

localStorage.setItem("games", JSON.stringify(games));

  function formatStatus(status) {
  const statusNames = {
    "not-started": "Not Started",
    "playing": "Playing",
    "paused": "Paused",
    "dropped": "Dropped",
    "finished": "Finished",
    "completed": "100%"
  };

  return statusNames[status] || "Unknown";
}

  function updateSummary() {
  const gameCount = games.length;

  let totalHours = 0;
    let totalPrice = 0;
let totalPotentialHours = 0;

games.forEach(function(game) {
  totalHours = totalHours + game.hours;
  totalPrice = totalPrice + game.price;
  totalPotentialHours = totalPotentialHours + game.completionHours;
});

let currentCost = "—";
let potentialCost = "—";

if (totalHours > 0) {
  currentCost = "$" + (totalPrice / totalHours).toFixed(2) + "/hr";
}

if (totalPotentialHours > 0) {
  potentialCost = "$" + (totalPrice / totalPotentialHours).toFixed(2) + "/hr";
}
    
  document.getElementById("game-count").textContent = gameCount + " games";
  document.getElementById("total-hours").textContent = totalHours + " hours played";
    document.getElementById("current-cost").textContent =
  "Current cost per hour: " + currentCost;

document.getElementById("potential-cost").textContent =
  "Potential cost per hour: " + potentialCost;
}
  
  function displayGame(game) {
    const gameList = document.getElementById("game-list");

    let currentCost = "Not played yet";
    let potentialCost = "Unknown";

    if (game.hours > 0) {
      currentCost = "$" + (game.price / game.hours).toFixed(2) + "/hr";
    }

    if (game.completionHours > 0) {
      potentialCost = "$" + (game.price / game.completionHours).toFixed(2) + "/hr";
    }

    gameList.innerHTML += `
      <div>
        <h3>
  <button class="game-title" onclick="openGame('${game.id}')">${game.title}</button>
</h3>

        <p>Purchase price: $${game.price.toFixed(2)}</p>
        <p>Hours played: ${game.hours}</p>
        <p>Estimated 100% time: ${game.completionHours} hours</p>
        <p>Status: ${formatStatus(game.status)}</p>
        <p>Current cost per hour: ${currentCost}</p>
        <p>Potential cost per hour: ${potentialCost}</p>
      </div>
    `;
  }

function refreshGameList() {
  const filterChoice = document.getElementById("filter-status").value;

  let filteredGames = games;

  if (filterChoice === "not-completed") {
    filteredGames = games.filter(function(game) {
      return game.status !== "completed";
    });
  } else if (filterChoice !== "all") {
    filteredGames = games.filter(function(game) {
      return game.status === filterChoice;
    });
  }

  sortGames(filteredGames);
}
  
function sortGames(gamesToSort = games) {
  const sortChoice = document.getElementById("sort-games").value;
  const sortedGames = [...gamesToSort];

  if (sortChoice === "title-asc") {
    sortedGames.sort(function(a, b) {
      return a.title.localeCompare(b.title);
    });
  }

  if (sortChoice === "title-desc") {
    sortedGames.sort(function(a, b) {
      return b.title.localeCompare(a.title);
    });
  }

if (sortChoice === "status-asc") {
  sortedGames.sort(function(a, b) {
    return formatStatus(a.status).localeCompare(formatStatus(b.status));
  });
}

if (sortChoice === "status-desc") {
  sortedGames.sort(function(a, b) {
    return formatStatus(b.status).localeCompare(formatStatus(a.status));
  });
}
  
  if (sortChoice === "price-asc") {
    sortedGames.sort(function(a, b) {
      return a.price - b.price;
    });
  }

  if (sortChoice === "price-desc") {
    sortedGames.sort(function(a, b) {
      return b.price - a.price;
    });
  }

  if (sortChoice === "hours-asc") {
    sortedGames.sort(function(a, b) {
      return a.hours - b.hours;
    });
  }

  if (sortChoice === "hours-desc") {
    sortedGames.sort(function(a, b) {
      return b.hours - a.hours;
    });
  }

  if (sortChoice === "completion-asc") {
    sortedGames.sort(function(a, b) {
      return a.completionHours - b.completionHours;
    });
  }

  if (sortChoice === "completion-desc") {
    sortedGames.sort(function(a, b) {
      return b.completionHours - a.completionHours;
    });
  }

  if (sortChoice === "current-cost-asc") {
    sortedGames.sort(function(a, b) {
      const aCost = a.hours > 0 ? a.price / a.hours : Infinity;
      const bCost = b.hours > 0 ? b.price / b.hours : Infinity;

      return aCost - bCost;
    });
  }

  if (sortChoice === "current-cost-desc") {
    sortedGames.sort(function(a, b) {
      const aCost = a.hours > 0 ? a.price / a.hours : -1;
      const bCost = b.hours > 0 ? b.price / b.hours : -1;

      return bCost - aCost;
    });
  }

  if (sortChoice === "potential-cost-asc") {
    sortedGames.sort(function(a, b) {
      const aCost =
        a.completionHours > 0 ? a.price / a.completionHours : Infinity;
      const bCost =
        b.completionHours > 0 ? b.price / b.completionHours : Infinity;

      return aCost - bCost;
    });
  }

  if (sortChoice === "potential-cost-desc") {
    sortedGames.sort(function(a, b) {
      const aCost =
        a.completionHours > 0 ? a.price / a.completionHours : -1;
      const bCost =
        b.completionHours > 0 ? b.price / b.completionHours : -1;

      return bCost - aCost;
    });
  }

  displayGameList(sortedGames);
}
  
function displayGameList(gamesToDisplay) {
  const gameList = document.getElementById("game-list");

  gameList.innerHTML = "";

  gamesToDisplay.forEach(function(game) {
    displayGame(game);
  });
}
  
function showAddGame() {
  document.getElementById("library-view").style.display = "none";
  document.getElementById("add-view").style.display = "block";
}

function cancelAddGame() {
  document.getElementById("add-view").style.display = "none";
  document.getElementById("library-view").style.display = "block";
}
  
function showLibrary() {
  document.getElementById("details-view").style.display = "none";
  document.getElementById("library-view").style.display = "block";
}

function displayPlaythroughs(game) {
  const playthroughList = document.getElementById("playthrough-list");

  playthroughList.innerHTML = "";

  game.playthroughs.forEach(function(playthrough) {
    let startDate = "Not recorded";
    let endDate = "Not recorded";

    if (playthrough.startedDate) {
      startDate = playthrough.startedDate;
    }

    if (playthrough.endedDate) {
      endDate = playthrough.endedDate;
    }

    playthroughList.innerHTML += `
      <div>
        <h4>Playthrough ${playthrough.number}</h4>
        <p>Status: ${formatStatus(playthrough.status)}</p>
        <p>Started: ${startDate}</p>
        <p>Ended: ${endDate}</p>
        <p>Logged sessions: ${playthrough.sessions.length}</p>
      </div>
    `;
  });
}
  
  function openGame(gameId) {
    selectedGameId = gameId;
  const game = games.find(function(game) {
    return game.id === gameId;
  });

  let currentCost = "Not played yet";
  let potentialCost = "Unknown";

  if (game.hours > 0) {
    currentCost = "$" + (game.price / game.hours).toFixed(2) + "/hr";
  }

  if (game.completionHours > 0) {
    potentialCost = "$" + (game.price / game.completionHours).toFixed(2) + "/hr";
  }

  document.getElementById("details-title").textContent = game.title;
  document.getElementById("details-price").textContent =
    "Purchase price: $" + game.price.toFixed(2);
  document.getElementById("details-hours").textContent =
    "Hours played: " + game.hours;
  document.getElementById("details-completion").textContent =
    "Estimated 100% time: " + game.completionHours + " hours";
   document.getElementById("details-status").textContent =
  "Status: " + formatStatus(game.status);
  document.getElementById("details-current-cost").textContent =
    "Current cost per hour: " + currentCost;
  document.getElementById("details-potential-cost").textContent =
    "Potential cost per hour: " + potentialCost;

displayPlaythroughs(game);
    
  document.getElementById("library-view").style.display = "none";
  document.getElementById("details-view").style.display = "block";
}

function editGame() {
  const game = games.find(function(game) {
    return game.id === selectedGameId;
  });

  document.getElementById("edit-title").value = game.title;
  document.getElementById("edit-price").value = game.price;
  document.getElementById("edit-hours").value = game.hours;
  document.getElementById("edit-completion-hours").value = game.completionHours;
  document.getElementById("edit-status").value = game.status;

  document.getElementById("details-view").style.display = "none";
  document.getElementById("edit-view").style.display = "block";
}

function cancelEdit() {
  document.getElementById("edit-view").style.display = "none";
  document.getElementById("details-view").style.display = "block";
}

function saveGame() {
  const game = games.find(function(game) {
    return game.id === selectedGameId;
  });

  game.title = document.getElementById("edit-title").value;
  game.price = Number(document.getElementById("edit-price").value);
  game.hours = Number(document.getElementById("edit-hours").value);
  game.completionHours = Number(
    document.getElementById("edit-completion-hours").value
  );

  game.status = document.getElementById("edit-status").value;

  localStorage.setItem("games", JSON.stringify(games));

  location.reload();
}
  
  function addGame() {
    const title = document.getElementById("game-title").value;
    const price = Number(document.getElementById("purchase-price").value);
    const hours = Number(document.getElementById("hours-played").value);
    const completionHours = Number(document.getElementById("completion-hours").value);
    const status = document.getElementById("game-status").value;

   const game = {
  id: crypto.randomUUID(),
  title: title,
  price: price,
  hours: hours,
  completionHours: completionHours,
  status: status,
  playthroughs: [
    {
      id: crypto.randomUUID(),
      number: 1,
      status: status,
      startedDate: null,
      endedDate: null,
      sessions: []
    }
  ]
};

    games.push(game);

    localStorage.setItem("games", JSON.stringify(games));

 refreshGameList();
updateSummary();
    document.getElementById("add-view").style.display = "none";
document.getElementById("library-view").style.display = "block";
  }

  

refreshGameList();
  updateSummary();
</script>

  
  
</html>
